# Build app images and push to Docker Hub.
# On push: only builds images for services whose paths (or shared/) changed.
# On manual run (workflow_dispatch): builds all images.
# Add secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (Hub Access Token with Read/Write).

name: Build and Push to Docker Hub

on:
  push:
    branches: [deploy-to-openstack]
    paths:
      - '.github/workflows/build-dockerhub.yml'
      - 'services/**'
      - 'shared/**'
  workflow_dispatch:

env:
  REGISTRY: docker.io

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get changed files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Building all images (manual run)"
            echo "build_all=true" >> $GITHUB_OUTPUT
          else
            echo "build_all=false" >> $GITHUB_OUTPUT
            git diff --name-only ${{ github.event.before }} ${{ github.sha }} > changed.txt
            echo "Changed files:"
            cat changed.txt
          fi

      - name: Set matrix (changed services only or all)
        id: set-matrix
        run: |
          BUILD_ALL="${{ steps.changed.outputs.build_all }}"
          if [ "$BUILD_ALL" = "true" ]; then
            # Manual run: build all
            matrix='[
              {"name":"video-ingestion","dockerfile":"services/video-ingestion/Dockerfile"},
              {"name":"video-preprocessing","dockerfile":"services/video-preprocessing/Dockerfile"},
              {"name":"clip-curation","dockerfile":"services/clip-curation/Dockerfile"},
              {"name":"yolo-pipeline","dockerfile":"services/yolo-pipeline/Dockerfile"},
              {"name":"sam3-pipeline","dockerfile":"services/sam3-pipeline/Dockerfile"},
              {"name":"dinov3-pipeline","dockerfile":"services/dinov3-pipeline/Dockerfile"},
              {"name":"tleap-pipeline","dockerfile":"services/tleap-pipeline/Dockerfile"},
              {"name":"tcn-pipeline","dockerfile":"services/tcn-pipeline/Dockerfile"},
              {"name":"transformer-pipeline","dockerfile":"services/transformer-pipeline/Dockerfile"},
              {"name":"tracking-service","dockerfile":"services/tracking-service/Dockerfile"},
              {"name":"gnn-pipeline","dockerfile":"services/gnn-pipeline/Dockerfile"},
              {"name":"graph-transformer-pipeline","dockerfile":"services/graph-transformer-pipeline/Dockerfile"},
              {"name":"ml-pipeline","dockerfile":"services/ml-pipeline/Dockerfile"},
              {"name":"fusion-service","dockerfile":"services/fusion-service/Dockerfile"},
              {"name":"shap-service","dockerfile":"services/shap-service/Dockerfile"},
              {"name":"rater-reliability","dockerfile":"services/rater-reliability/Dockerfile"},
              {"name":"llm-service","dockerfile":"services/llm-service/Dockerfile"},
              {"name":"training-service","dockerfile":"services/training-service/Dockerfile"},
              {"name":"annotation-renderer","dockerfile":"services/annotation-renderer/Dockerfile"},
              {"name":"admin-backend","dockerfile":"services/admin-interface/backend/Dockerfile"},
              {"name":"admin-frontend","dockerfile":"services/admin-interface/frontend/Dockerfile"}
            ]'
          else
            # Push: only services with changed paths or shared/
            CHANGED_FILES=$(cat changed.txt)
            need_build=()
            for entry in \
              "video-ingestion:services/video-ingestion/" \
              "video-preprocessing:services/video-preprocessing/" \
              "clip-curation:services/clip-curation/" \
              "yolo-pipeline:services/yolo-pipeline/" \
              "sam3-pipeline:services/sam3-pipeline/" \
              "dinov3-pipeline:services/dinov3-pipeline/" \
              "tleap-pipeline:services/tleap-pipeline/" \
              "tcn-pipeline:services/tcn-pipeline/" \
              "transformer-pipeline:services/transformer-pipeline/" \
              "tracking-service:services/tracking-service/" \
              "gnn-pipeline:services/gnn-pipeline/" \
              "graph-transformer-pipeline:services/graph-transformer-pipeline/" \
              "ml-pipeline:services/ml-pipeline/" \
              "fusion-service:services/fusion-service/" \
              "shap-service:services/shap-service/" \
              "rater-reliability:services/rater-reliability/" \
              "llm-service:services/llm-service/" \
              "training-service:services/training-service/" \
              "annotation-renderer:services/annotation-renderer/" \
              "admin-backend:services/admin-interface/backend/" \
              "admin-frontend:services/admin-interface/frontend/"; do
              name="${entry%%:*}"
              path="${entry#*:}"
              if echo "$CHANGED_FILES" | grep -qE "^($path|shared/)"; then
                case "$name" in
                  video-ingestion) df="services/video-ingestion/Dockerfile" ;;
                  video-preprocessing) df="services/video-preprocessing/Dockerfile" ;;
                  clip-curation) df="services/clip-curation/Dockerfile" ;;
                  yolo-pipeline) df="services/yolo-pipeline/Dockerfile" ;;
                  sam3-pipeline) df="services/sam3-pipeline/Dockerfile" ;;
                  dinov3-pipeline) df="services/dinov3-pipeline/Dockerfile" ;;
                  tleap-pipeline) df="services/tleap-pipeline/Dockerfile" ;;
                  tcn-pipeline) df="services/tcn-pipeline/Dockerfile" ;;
                  transformer-pipeline) df="services/transformer-pipeline/Dockerfile" ;;
                  tracking-service) df="services/tracking-service/Dockerfile" ;;
                  gnn-pipeline) df="services/gnn-pipeline/Dockerfile" ;;
                  graph-transformer-pipeline) df="services/graph-transformer-pipeline/Dockerfile" ;;
                  ml-pipeline) df="services/ml-pipeline/Dockerfile" ;;
                  fusion-service) df="services/fusion-service/Dockerfile" ;;
                  shap-service) df="services/shap-service/Dockerfile" ;;
                  rater-reliability) df="services/rater-reliability/Dockerfile" ;;
                  llm-service) df="services/llm-service/Dockerfile" ;;
                  training-service) df="services/training-service/Dockerfile" ;;
                  annotation-renderer) df="services/annotation-renderer/Dockerfile" ;;
                  admin-backend) df="services/admin-interface/backend/Dockerfile" ;;
                  admin-frontend) df="services/admin-interface/frontend/Dockerfile" ;;
                  *) df="" ;;
                esac
                need_build+=("{\"name\":\"$name\",\"dockerfile\":\"$df\"}")
              fi
            done
            if [ ${#need_build[@]} -eq 0 ]; then
              matrix='[]'
            else
              matrix="[$(IFS=,; echo "${need_build[*]}")]"
            fi
            echo "Services to build: $matrix"
          fi
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  build-and-push:
    name: Build and push ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/lameness-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha
